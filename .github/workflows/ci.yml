name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  architecture-enforcement:
    name: typecheck -> lint -> architecture -> unit -> integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (32 projects, turbo)
        run: pnpm typecheck

      - name: Lint (ESLint architecture rules)
        run: pnpm lint

      - name: Architecture check (dependency-cruiser + structural guards)
        run: pnpm architecture:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration
