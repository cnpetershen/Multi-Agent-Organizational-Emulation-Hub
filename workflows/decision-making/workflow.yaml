workflow_id: decision-making
version: 1
name: Decision Making
# 与 product-analysis/workflow.yaml 同一条约定：任务步只声明「需要哪一类工作」（capability），
# 由运行中的组织解析出具体岗位；只有审批门写 required_roles（理由见那个文件的头部注释）。
# 决策提案要摆出备选方案（options）→ technical_design，由声明该能力的席位承接。
# CEO 只在 decision-gate 拍板，不起草。
description: Proposal, approval gate, and an automated decision record.
cycle_policy: forbid
entry_stage: proposal
terminal_stages: [record]
stages:
  - stage_id: proposal
    name: Proposal
    steps:
      - step_id: proposal-task
        name: Draft the proposal
        kind: task
        assignment:
          kind: capability
          capability: technical_design
        verification:
          kind: deterministic
          required_output_keys: [options]
        max_attempts: 2
    transitions:
      - transition_id: proposal-task__completed
        from_step_id: proposal-task
        when:
          kind: task_status
          status: completed
        to:
          kind: stage
          stage_id: review
      - transition_id: proposal-task__rejected
        from_step_id: proposal-task
        when:
          kind: task_status
          status: rejected
        to:
          kind: fail
          reason: proposal_failed
  - stage_id: review
    name: Review
    steps:
      - step_id: decision-gate
        name: Decide on the proposal
        kind: approval
        required_roles: [ceo]
        required_authority:
          domain: org
          level: 3
        approval_policy: single
        required_count: 1
    transitions:
      - transition_id: decision-gate__granted
        from_step_id: decision-gate
        when:
          kind: approval_decision
          decision: granted
        to:
          kind: stage
          stage_id: record
      - transition_id: decision-gate__denied
        from_step_id: decision-gate
        when:
          kind: approval_decision
          decision: denied
        to:
          kind: fail
          reason: decision_rejected
  - stage_id: record
    name: Record
    steps:
      - step_id: record-decision
        name: Record the decision
        kind: automated
        description: Writes the decision into the decision log.
    transitions:
      - transition_id: record-decision__done
        from_step_id: record-decision
        when:
          kind: always
        to:
          kind: complete
